<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador ClouDDy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #0b1020;
      color: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitulo,
    .ajuda {
      color: #aab4c5;
    }

    .painel {
      margin-top: 24px;
      padding: 24px;
      border: 1px solid #29364a;
      border-radius: 14px;
      background: #111827;
    }

    .campos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .campo-servidor {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #3b475a;
      border-radius: 8px;
      outline: none;
      background: #0b1220;
      color: #f3f4f6;
      font-size: 15px;
    }

    input:focus {
      border-color: #60a5fa;
    }

    .senha-linha {
      display: flex;
    }

    .senha-linha input {
      border-radius: 8px 0 0 8px;
    }

    .mostrar-senha {
      padding: 0 12px;
      border: 1px solid #3b475a;
      border-left: 0;
      border-radius: 0 8px 8px 0;
      background: #263449;
      color: white;
      cursor: pointer;
    }

    .ajuda {
      display: block;
      margin-top: 7px;
      font-size: 13px;
    }

    button {
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .gerar {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #2563eb;
      color: white;
      font-size: 15px;
    }

    .gerar:hover {
      background: #1d4ed8;
    }

    .resultados {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }

    .resultado {
      min-width: 0;
      padding: 18px;
      border: 1px solid #29364a;
      border-radius: 12px;
      background: #111827;
    }

    .resultado-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .resultado h2 {
      margin: 0;
    }

    .copiar {
      padding: 9px 12px;
      background: #263449;
      color: white;
    }

    .copiar:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .saida {
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
    }

    #status {
      min-height: 20px;
      color: #aab4c5;
    }

    #status.erro {
      color: #fca5a5;
    }

    .aviso {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #29364a;
      border-radius: 10px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .campos,
      .resultados {
        grid-template-columns: 1fr;
      }

      .campo-servidor {
        grid-column: auto;
      }

      .painel {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Gerador de API ClouDDy</h1>
    <p class="subtitulo">Preencha os dados para gerar os formatos TS e HLS.</p>

    <section class="painel">
      <form id="formulario">
        <div class="campos">
          <div>
            <label for="username">Username</label>
            <input id="username" type="text" required autocomplete="off">
          </div>

          <div>
            <label for="password">Password</label>
            <div class="senha-linha">
              <input id="password" type="password" required autocomplete="new-password">
              <button class="mostrar-senha" id="mostrarSenha" type="button">
                Mostrar
              </button>
            </div>
          </div>

          <div class="campo-servidor">
            <label for="servidor">Servidor</label>
            <input
              id="servidor"
              type="text"
              placeholder="exemplo.com:8080"
              required
              autocomplete="off"
            >
            <small class="ajuda">
              Informe o domínio ou IP e a porta, sem protocolo ou caminho.
            </small>
          </div>
        </div>

        <button class="gerar" type="submit">Gerar links</button>
      </form>
    </section>

    <section class="resultados" aria-label="Links gerados">
      <article class="resultado">
        <div class="resultado-topo">
          <h2>TS</h2>
          <button
            class="copiar"
            type="button"
            data-target="saidaTS"
            data-nome="TS"
            disabled
          >
            Copiar
          </button>
        </div>
        <input class="saida" id="saidaTS" type="text" readonly placeholder="Link TS">
      </article>

      <article class="resultado">
        <div class="resultado-topo">
          <h2>HLS</h2>
          <button
            class="copiar"
            type="button"
            data-target="saidaHLS"
            data-nome="HLS"
            disabled
          >
            Copiar
          </button>
        </div>
        <input class="saida" id="saidaHLS" type="text" readonly placeholder="Link HLS">
      </article>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <div class="aviso">
      Os links incluem seu usuário e senha. Evite compartilhá-los publicamente.
      Os dados são usados apenas no navegador e não são enviados a um servidor.
    </div>
  </main>

  <script>
    const formulario = document.getElementById("formulario");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const servidor = document.getElementById("servidor");
    const saidaTS = document.getElementById("saidaTS");
    const saidaHLS = document.getElementById("saidaHLS");
    const status = document.getElementById("status");
    const botoesCopiar = document.querySelectorAll(".copiar");

    formulario.addEventListener("submit", (event) => {
      event.preventDefault();

      const usuario = username.value.trim();
      const senha = password.value;
      const host = servidor.value.trim().replace(/\/+$/, "");

      if (!usuario || !senha || !host) {
        status.textContent = "Preencha Username, Password e Servidor.";
        status.classList.add("erro");
        return;
      }

      saidaTS.value = `xc://${usuario}:${senha}@${host}/streaming=mpegts`;
      saidaHLS.value = `xc://${usuario}:${senha}@${host}/streaming=m3u8`;

      botoesCopiar.forEach((botao) => {
        botao.disabled = false;
      });

      status.textContent = "Links gerados.";
      status.classList.remove("erro");
    });

    document.getElementById("mostrarSenha").addEventListener("click", (event) => {
      const botao = event.currentTarget;
      const visivel = password.type === "text";

      password.type = visivel ? "password" : "text";
      botao.textContent = visivel ? "Mostrar" : "Ocultar";
    });

    async function copiarLink(botao) {
      const campo = document.getElementById(botao.dataset.target);

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(campo.value);
        } else {
          campo.focus();
          campo.select();

          if (!document.execCommand("copy")) {
            throw new Error("Falha ao copiar");
          }
        }

        status.textContent = `Link ${botao.dataset.nome} copiado.`;
        status.classList.remove("erro");
      } catch {
        campo.focus();
        campo.select();
        status.textContent = "Não foi possível copiar automaticamente. Copie o texto selecionado.";
        status.classList.add("erro");
      }
    }

    botoesCopiar.forEach((botao) => {
      botao.addEventListener("click", () => copiarLink(botao));
    });

    [username, password, servidor].forEach((campo) => {
      campo.addEventListener("input", () => {
        saidaTS.value = "";
        saidaHLS.value = "";
        botoesCopiar.forEach((botao) => {
          botao.disabled = true;
        });
        status.textContent = "";
      });
    });
  </script>
</body>
</html>
